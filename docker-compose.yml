services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: music_search
      POSTGRES_USER: music_search
      POSTGRES_PASSWORD: music_search
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - music_search_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_search -d music_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  music_search_postgres_data:
